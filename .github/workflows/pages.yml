name: Deploy Fixora to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build temporary Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="${{ runner.temp }}/published-site"
          mkdir -p "$publish_dir"
          cp -R assets pages "$publish_dir/"
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head>' \
            '  <meta charset="utf-8">' \
            '  <meta name="viewport" content="width=device-width, initial-scale=1">' \
            '  <meta http-equiv="refresh" content="0; url=./pages/index.html">' \
            '  <title>Fixora Appliance Repair</title>' \
            '  <script>window.location.replace("./pages/index.html");</script>' \
            '</head>' \
            '<body>' \
            '  <p>Redirecting to <a href="./pages/index.html">Fixora Appliance Repair</a>...</p>' \
            '</body>' \
            '</html>' > "$publish_dir/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/published-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
